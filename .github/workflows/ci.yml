name: documentation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: docker compose config --quiet
      - run: docker build -t seagull-wiki:ci .
      - run: docker run -d --name seagull-wiki-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 seagull-wiki:ci
      - run: npm run test:browser
        env:
          DOCS_TEST_URL: http://127.0.0.1:8080
      - if: always()
        run: docker logs seagull-wiki-ci; docker rm -f seagull-wiki-ci
